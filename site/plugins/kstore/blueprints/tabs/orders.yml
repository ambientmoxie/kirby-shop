# Orders tab of the site blueprint, used as: orders: { extends: kstore/tabs/orders }
label: Orders
icon: draft

# Same sections as the orders page (pages/orders.yml)
columns:
  left:
    width: 2/3
    sections:
      pendingOrders:
        headline: To fulfil
        type: pages
        query: site.find("orders").drafts.filterBy("state", "!=", "pending")
        info: "{{ page.emailError }}"
        create: false
        templates:
          - order
        limit: 50

      # Checkouts sent to Stripe and not paid (yet): abandoned ones stay here
      awaitingPayment:
        headline: Awaiting payment
        type: pages
        query: site.find("orders").drafts.filterBy("state", "pending")
        info: "{{ page.createdAt }}"
        create: false
        templates:
          - order
        limit: 50

  right:
    width: 1/3
    sections:
      completedOrders:
        headline: Complete
        type: pages
        parent: site.find("orders")
        status: listed
        create: false
        templates:
          - order
        limit: 50

      issueOrders:
        headline: Issue
        type: pages
        parent: site.find("orders")
        status: unlisted
        info: "{{ page.lastError }}"
        create: false
        templates:
          - order
        limit: 50
