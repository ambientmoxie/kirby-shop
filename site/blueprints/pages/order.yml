title: Order
icon: draft

status:
  draft: Incomplete
  unlisted: Issue
  listed: Complete

tabs:
  productOverview:
    label: Ticket
    icon: draft
    sections:
      orderDetails:
        type: fields
        fields:
          orderNumber:
            label: Order number
            type: text
            disabled: true
            width: 1/2
          orderId:
            label: Internal ID
            type: text
            disabled: true
            width: 1/2
          items:
            label: Items
            type: structure
            translate: false
            fields:
              title:
                label: Title
                type: text
                required: true
              quantity:
                label: Quantity
                type: number
                required: true
                width: 1/2
              price:
                label: Price
                type: number
                step: 0.01
                required: true
                width: 1/2

  buyerInformation:
    label: Buyer Information
    icon: user
    sections:
      buyerInformation:
        type: fields
        fields:
          name:
            label: Name
            type: text
            width: 1/2
          surname:
            label: Surname
            type: text
            width: 1/2
          email:
            label: Email
            type: email
          address:
            label: Address
            type: text
          zipcode:
            label: Zip code
            type: text
            width: 1/3
          city:
            label: City
            type: text
            width: 1/3
          country:
            label: Country
            type: text
            width: 1/3
          additionalInformations:
            label: Additional information
            type: textarea
            size: small
