title: Order
icon: draft

status:
  draft: Incomplete
  unlisted: Issue
  listed: Complete

tabs:
  productOverview:
    label: Ticket
    icon: draft
    sections:
      orderDetails:
        type: fields
        fields:
          orderNumber:
            label: Order number
            type: text
            disabled: true
            width: 1/2
          total:
            label: Total
            type: number
            step: 0.01
            disabled: true
            width: 1/2
          items:
            label: Items
            type: structure
            translate: false
            fields:
              productId:
                type: hidden
              title:
                label: Title
                type: text
                required: true
              color:
                label: Color
                type: text
              quantity:
                label: Quantity
                type: number
                required: true
                width: 1/2
              price:
                label: Price
                type: number
                step: 0.01
                required: true
                width: 1/2

  # Written by the checkout (see processOrder in the kstore plugin), read-only here
  processing:
    label: Processing
    icon: settings
    sections:
      processingDetails:
        type: fields
        fields:
          state:
            label: State
            type: text
            disabled: true
            width: 1/2
          paymentMethod:
            label: Payment
            type: text
            disabled: true
            width: 1/2
          lastError:
            label: Last error
            type: textarea
            size: small
            disabled: true
          emailsSent:
            label: Emails sent
            type: toggle
            disabled: true
            width: 1/3
          emailError:
            label: Email error
            type: text
            disabled: true
            width: 2/3
          createdAt:
            label: Created
            type: text
            disabled: true
            width: 1/2
          confirmedAt:
            label: Confirmed
            type: text
            disabled: true
            width: 1/2
          stockApplied:
            label: Stock updated for
            type: text
            disabled: true
          orderId:
            label: Internal ID
            type: text
            disabled: true
            width: 1/2
          stripeSessionId:
            label: Stripe session
            type: text
            disabled: true
            width: 1/2

  buyerInformation:
    label: Buyer Information
    icon: user
    sections:
      buyerInformation:
        type: fields
        fields:
          name:
            label: Name
            type: text
            width: 1/2
          surname:
            label: Surname
            type: text
            width: 1/2
          email:
            label: Email
            type: email
          address:
            label: Address
            type: text
          zipcode:
            label: Zip code
            type: text
            width: 1/3
          city:
            label: City
            type: text
            width: 1/3
          country:
            label: Country
            type: text
            width: 1/3
          additionalInformations:
            label: Additional information
            type: textarea
            size: small
