title: Orders
icon: draft
create: false

columns:
  pending:
    width: 2/3
    sections:
      pendingOrders:
        headline: To fulfil
        type: pages
        query: page.drafts.filterBy("state", "!=", "pending")
        info: "{{ page.emailError }}"
        create: false

      # Checkouts sent to Stripe and not paid (yet): abandoned ones stay here
      awaitingPayment:
        headline: Awaiting payment
        type: pages
        query: page.drafts.filterBy("state", "pending")
        info: "{{ page.createdAt }}"
        create: false

  treated:
    width: 1/3
    sections:
      completedOrders:
        headline: Complete
        type: pages
        status: listed
        create: false

      issueOrders:
        headline: Issue
        type: pages
        status: unlisted
        info: "{{ page.lastError }}"
        create: false
