title: Site

tabs:

  store:
    label: Store
    icon: globe

    columns:
      # LEFT (2/3) — PUBLISHED PRODUCTS
      products:
        width: 2/3
        sections:
          listed:
            headline: Products
            type: pages
            parent: site.find("shop")
            status: listed
            create: product
            templates:
              - product
            image:
              back: black
              cover: true

      # RIGHT (1/3) — DRAFTS + UNLISTED
      sidebar:
        width: 1/3
        sections:
          drafts:
            headline: Drafts
            type: pages
            parent: site.find("shop")
            status: draft
            create: product
            templates:
              - product

          unlisted:
            headline: Unlisted
            type: pages
            parent: site.find("shop")
            status: unlisted
            create: false
            templates:
              - product

  # Provided by the kstore plugin
  orders:
    extends: kstore/tabs/orders

  settings:
    label: Settings
    icon: cog

    sections:
      settingsFields:
        type: fields
        fields:

          newsletter:
            width: 2/3
            label: Newsletter
            type: structure
            disabled: true
            fields:
              date:
                label: Date
                type: date
              value:
                label: Address
                type: text

          # Provided by the kstore plugin
          stripeEnabled:
            extends: kstore/fields/stripe-enabled
            width: 1/3
